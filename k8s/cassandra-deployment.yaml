apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
  labels:
    app: cassandra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: cassandra
        image: cassandra:4.1
        env:
        - name: CASSANDRA_CLUSTER_NAME
          value: "fintech-cluster"
        ports:
        - containerPort: 9042
        volumeMounts:
        - name: cassandra-data
          mountPath: /var/lib/cassandra
        - name: cassandra-setup
          mountPath: /cassandra-setup.cql
          subPath: cassandra-setup.cql
      volumes:
      - name: cassandra-data
        persistentVolumeClaim:
          claimName: cassandra-pvc
      - name: cassandra-setup
        configMap:
          name: cassandra-setup
